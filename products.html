<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 관리</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">홈</a>
      <a href="products.html" class="active">상품 관리</a>
      <a href="login.html">로그인</a>
    </nav>
  </header>

  <main>
    <h1>상품 관리</h1>

    <section class="product-list">
      <h2>상품 목록</h2>
      <table>
        <thead>
          <tr>
            <th>상품명</th>
            <th>가격</th>
            <th>재고</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- 상품 정보 출력 -->
        </tbody>
      </table>
    </section>

    <section class="product-form">
      <h2>상품 등록</h2>
      <form>
        <label for="product-name">상품명:</label>
        <input type="text" id="product-name" name="product-name" required>

        <label for="product-price">가격:</label>
        <input type="number" id="product-price" name="product-price" required>

        <label for="product-stock">재고:</label>
        <input type="number" id="product-stock" name="product-stock" required>

        <button type="submit">등록</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 OrderHere. All rights reserved.</p>
  </footer>

  <script src="js/products.js"></script>
</body>
</html>

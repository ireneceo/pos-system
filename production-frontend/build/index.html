<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple Here - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease-out;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease-out 0.2s;
            animation-fill-mode: both;
        }
        .status {
            background: rgba(255, 255, 255, 0.2);
            padding: 1rem 2rem;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease-out 0.4s;
            animation-fill-mode: both;
        }
        .link {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            animation: fadeInUp 1s ease-out 0.6s;
            animation-fill-mode: both;
        }
        .link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .server-info {
            margin-top: 3rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            animation: fadeInUp 1s ease-out 0.8s;
            animation-fill-mode: both;
        }
        .server-info h3 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        .server-status {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .status-item {
            text-align: left;
        }
        .status-item strong {
            display: block;
            margin-bottom: 0.5rem;
            color: #a3ffbd;
        }
        .check {
            color: #4ade80;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status">
            <span class="check">✅</span> 시스템 구축 완료
        </div>
        <h1>Purple Here</h1>
        <p>운영 서버가 준비되었습니다!</p>
        <p>프론트엔드를 배포하면 서비스를 시작할 수 있습니다.</p>
        
        <div class="server-info">
            <h3>서버 상태</h3>
            <div class="server-status">
                <div class="status-item">
                    <strong>백엔드</strong>
                    <div><span class="check">✅</span> 실행 중 (포트 3002)</div>
                </div>
                <div class="status-item">
                    <strong>데이터베이스</strong>
                    <div><span class="check">✅</span> 연결됨</div>
                </div>
                <div class="status-item">
                    <strong>SSL</strong>
                    <div><span class="check">✅</span> 인증서 설치됨</div>
                </div>
            </div>
        </div>
        
        <a href="https://dev.purplehere.com" class="link">
            개발 서버 바로가기 →
        </a>
    </div>
</body>
</html>

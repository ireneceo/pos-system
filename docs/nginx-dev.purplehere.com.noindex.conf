# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name dev.purplehere.com;

    # Let's Encrypt 인증서 갱신을 위한 경로
    location /.well-known/acme-challenge/ {
        root /var/www/dev-frontend-build;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 서버
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.purplehere.com;

    # SSL 인증서
    ssl_certificate /etc/letsencrypt/live/dev.purplehere.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.purplehere.com/privkey.pem;

    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 프론트엔드 정적 파일
    root /var/www/dev-frontend-build;
    index index.html;

    # 백엔드 API 프록시
    location /uploads/ {
        add_header X-Robots-Tag "noindex, nofollow" always;  # 개발 사이트 검색 제외 (2026-09-21 SEO H5)
        add_header Access-Control-Allow-Origin *;
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Socket.io (필요한 경우)
    location /socket.io/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 정적 파일 처리 (JS/CSS 번들 - 해시 포함)
    location /static/ {
        add_header X-Robots-Tag "noindex, nofollow" always;  # 개발 사이트 검색 제외 (2026-09-21 SEO H5)
        expires 1y;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    # 이미지/아이콘/폰트 캐시 (/uploads/ 제외 - proxy로 처리)
    location ~* ^(?!/uploads/|/api/|/socket\.io/).*\.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        add_header X-Robots-Tag "noindex, nofollow" always;  # 개발 사이트 검색 제외 (2026-09-21 SEO H5)
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # index.html: 절대 캐시 안 됨 (SPA 새 번들로 즉시 전환되도록)
    location = /index.html {
        add_header X-Robots-Tag "noindex, nofollow" always;  # 개발 사이트 검색 제외 (2026-09-21 SEO H5)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # React Router (SPA) 지원 — index.html fallback도 no-cache
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;  # 개발 사이트 검색 제외 (2026-09-21 SEO H5)
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 파일 업로드 크기 제한
    client_max_body_size 50M;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
}

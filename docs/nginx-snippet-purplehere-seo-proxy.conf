# /etc/nginx/snippets/purplehere-seo-proxy.conf — 마케팅 HTML 프록시 공통 (2026-09-24 SEO C1)
# 개발·운영 같은 내용. 설치: sudo cp docs/nginx-snippet-purplehere-seo-proxy.conf /etc/nginx/snippets/purplehere-seo-proxy.conf
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 3s;
proxy_read_timeout 10s;
# 백엔드 실패만 정적으로 되돌린다. 404(없는 글)는 백엔드 응답 그대로 — 여기 404 를 넣으면 soft 404 로 돌아간다.
proxy_intercept_errors on;
error_page 502 503 504 = @seo_static_fallback;

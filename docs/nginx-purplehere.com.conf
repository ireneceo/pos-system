server {
    server_name purplehere.com www.purplehere.com;

    # Frontend (React build) - 운영 프론트엔드
    root /var/www/production-frontend/build;
    index index.html;

    # 에러 페이지
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Service worker MUST revalidate — exact-match wins over the .js regex below.
    # Long-caching sw.js (Cloudflare 1y immutable) blocked every SW/bundle update from
    # reaching store devices (chronic "stale bundle" bug). 2026-06-09.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        try_files $uri =404;
    }

    # ── 크롤러용 마케팅 HTML (2026-09-24 SEO C1 · production-backend/routes/seo-html.js)
    # 마케팅 주소만 백엔드가 페이지별 제목·canonical·본문을 채워 준다. POS 안쪽 경로는 아래 location / 그대로.
    # 주소 목록 = config/seoPages.js STATIC_PAGES (바꾸면 여기와 개발 설정도 같이 — check-seo-nginx.js 가 대조)
    # 백엔드가 죽거나 느리면(502/503/504) 정적 index.html 로 복귀 — 지금보다 나빠지는 경우가 없다.
    # 캐시 헤더는 백엔드가 붙인다(여기서 add_header 로 또 붙이면 두 벌).
    location = / {
        # www → apex 301 은 **마케팅 주소만** (2026-09-24 SEO B). 앱 경로(/pos 등)를 www 로 쓰는 기기가 있으면
        # 주소를 옮기는 순간 그 기기의 localStorage(로그인·printerSettings)가 안 보인다 — 운영 로그로 사용 여부 확인 불가라 넓히지 않는다.
        if ($host = www.purplehere.com) { return 301 https://purplehere.com$request_uri; }
        proxy_pass http://127.0.0.1:3002/seo-html$request_uri;
        include /etc/nginx/snippets/purplehere-seo-proxy.conf;
    }
    location ~ ^/(?:pricing|features|packages|about|faq|blog|news|contact|demo|referral-program|company|privacy|terms|(?:blog|news)/[^/]+)$ {
        # www → apex 301 은 **마케팅 주소만** (2026-09-24 SEO B). 앱 경로(/pos 등)를 www 로 쓰는 기기가 있으면
        # 주소를 옮기는 순간 그 기기의 localStorage(로그인·printerSettings)가 안 보인다 — 운영 로그로 사용 여부 확인 불가라 넓히지 않는다.
        if ($host = www.purplehere.com) { return 301 https://purplehere.com$request_uri; }
        proxy_pass http://127.0.0.1:3002/seo-html$request_uri;
        include /etc/nginx/snippets/purplehere-seo-proxy.conf;
    }
    location @seo_static_fallback {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files /index.html =404;
    }

    # Cache static assets (Production - 적극적 캐싱)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # 파일명에 해시가 없는 루트 자산 — 내용이 바뀌어도 URL 이 같으므로 immutable 을 걸면 안 된다.
    # 2026-09-09: favicon.ico 를 새로 만들어 배포했는데 «1년 immutable» 탓에 옛 아이콘이 계속 나왔다
    # (PDF 등 비-HTML 문서는 <link rel=icon> 이 없어 이 파일로 폴백한다).
    # 정확일치 location 은 정규식보다 우선한다. /static/ 아래 해시 붙은 번들은 그대로 1년 캐시.
    location = /favicon.ico           { expires 1h; add_header Cache-Control "public, max-age=3600"; access_log off; }
    location = /favicon-48.png        { expires 1h; add_header Cache-Control "public, max-age=3600"; access_log off; }
    location = /apple-touch-icon.png  { expires 1h; add_header Cache-Control "public, max-age=3600"; access_log off; }
    location = /logo192.png           { expires 1h; add_header Cache-Control "public, max-age=3600"; access_log off; }
    location = /logo512.png           { expires 1h; add_header Cache-Control "public, max-age=3600"; access_log off; }
    location = /og-image.png          { expires 1h; add_header Cache-Control "public, max-age=3600"; access_log off; }
    location = /app-icon.svg          { expires 1h; add_header Cache-Control "public, max-age=3600"; access_log off; }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # HTML files - 짧은 캐시
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Socket.IO - proxy to backend (포트 3002)
    location /socket.io/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Socket.IO specific timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Uploaded images - proxy to backend
    # 캐시 정책은 **백엔드가 정한다** (Cache-Control: public, max-age=0 + ETag/Last-Modified).
    # 여기서 expires/add_header 로 덮어쓰면 안 된다 — 2026-09-09 사고:
    #   «1년 immutable» 로 덮은 탓에 응답이 **헤더째** 굳었고, 나중에 /uploads 의
    #   X-Frame-Options 를 DENY→SAMEORIGIN 으로 고쳐도 이미 캐시한 브라우저·CDN 이
    #   옛 DENY 를 계속 써서 인보이스 미리보기가 «refused to connect» 로 막혔다.
    #   immutable 은 «재검증하지 말라»는 뜻이라 새로고침으로도 안 풀린다.
    # 백엔드 정책(max-age=0 + ETag)이면 매 요청이 304 라 비용은 사실상 같고,
    # 보안 헤더 변경이 즉시 전파된다.
    location ^~ /uploads {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (포트 3002)
    location /api {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_cache_bypass $http_upgrade;

        # Allow larger request body
        client_max_body_size 10M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # API 캐싱 비활성화
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;

        proxy_intercept_errors off;
    }

    # Frontend - SPA routing
    location / {
        # 끝 슬래시 주소 → 슬래시 없는 주소 301 (2026-09-24 SEO B). /api·/socket.io·/uploads 는 자기 location 이라 무관.
        # 같은 호스트 안에서만 옮긴다(www 는 www 로) — 기기 저장소가 바뀌지 않는다
        rewrite ^/(.+)/$ https://$host/$1 permanent;
        index index.html;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/purplehere.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/purplehere.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.purplehere.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = purplehere.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name purplehere.com www.purplehere.com;
    return 404; # managed by Certbot
}

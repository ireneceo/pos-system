<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#635BFF"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle geometric decorations -->
  <circle cx="100" cy="100" r="180" fill="rgba(255,255,255,0.03)"/>
  <circle cx="1100" cy="530" r="220" fill="rgba(255,255,255,0.03)"/>
  <circle cx="900" cy="80" r="120" fill="rgba(255,255,255,0.02)"/>
  <rect x="50" y="50" width="1100" height="530" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Brand Name -->
  <text x="600" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="800" fill="white" letter-spacing="2">PurpleHere</text>
  <!-- Divider line -->
  <rect x="480" y="260" width="240" height="3" rx="2" fill="url(#accent)" opacity="0.8"/>
  <!-- Tagline -->
  <text x="600" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="rgba(255,255,255,0.95)">Cloud POS System for Restaurants</text>
  <!-- Features -->
  <text x="600" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="rgba(255,255,255,0.75)" letter-spacing="3">REAL-TIME ORDERS · MULTI-LOCATION · KITCHEN DISPLAY · ANALYTICS</text>
  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.6"/>
  <!-- URL -->
  <text x="600" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)">purplehere.com</text>
</svg>
